# The gate (governance/README.md#the-gate), run on every pull request over its final commit.
# A proposal is merged only when every run its kind requires passes. The two long runs, the
# comparison of the implementations and the single-edit enumeration, are divided among jobs
# with --shard K/N, whose parts together are the whole run.
name: gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.21"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.14.0"

jobs:
  suite:
    name: the suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: typescript
      - run: uv run --frozen pytest -q
      - run: npm test
        working-directory: typescript
      - run: npx tsc --noEmit -p .
        working-directory: typescript

  rebuild:
    name: the rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen python tools/check_rebuild.py

  dependencies:
    name: the dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: the Python packages of uv.lock, against the known advisories
        run: uv audit --frozen --preview-features audit-command
      - name: the TypeScript packages of package-lock.json, against the known advisories
        run: npm audit
        working-directory: typescript

  format:
    name: the format of each proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: check the proposals the pull request adds or changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "no pull request: no proposal to check"; exit 0; fi
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'proposals/[0-9]*.md')
          if [ -z "$files" ]; then echo "the pull request adds no proposal"; exit 0; fi
          uv run --frozen python tools/check_proposal.py --merge $files

  implementations:
    name: the two implementations (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: typescript
      - run: uv run --frozen python tools/compare_implementations.py 120 39 --shard ${{ matrix.shard }}/3

  planted-defects:
    name: the planted defects
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: typescript
      - run: uv run --frozen python tools/run_mutants.py 4

  tokenizers:
    name: the tokenizer panel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen python tools/tokenizer_panel.py check

  enumeration:
    name: the single-edit enumeration (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen python tools/run_enumerations.py both 4 --shard ${{ matrix.shard }}/4

  originality:
    name: the originality of words and glyphs, where a change adds them
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: compare the words, where the pull request changes the roots
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && [ -z "$(git diff --name-only "$BASE"...HEAD -- lexicon/roots)" ]; then
            echo "the pull request changes no root"; exit 0
          fi
          uv run --frozen python tools/compare_roots.py compare
      - name: compare the glyphs, where the pull request changes the writing system
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && [ -z "$(git diff --name-only "$BASE"...HEAD -- language/writing.json language/font)" ]; then
            echo "the pull request changes no glyph"; exit 0
          fi
          uv run --frozen python tools/compare_glyphs.py
