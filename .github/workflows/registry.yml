# Publishes the server's entry, server.json, to the MCP Registry from a release tag, run on
# demand by a maintainer who names the tag, as v1.1.2, once the Python package of that tag
# is on PyPI. The registry stores the entry and not the package: it checks that the package
# on PyPI names the entry, by the line `mcp-name: io.github.rowih/rowih` in its description.
# GitHub's identity token proves the repository's organisation, so no token is stored, and
# the registry's publisher is pinned by release and its signature verified before it runs.
name: registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag whose entry to publish, as v1.1.2"
        required: true
        type: string

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "v1.8.4"
  SERVER_NAME: "io.github.rowih/rowih"

jobs:
  publish:
    name: the entry in the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.rowih/rowih
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that the tag names a release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form v1.1.2"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Check that the entry names the tag's package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          entry = json.load(open("server.json", encoding="utf-8"))
          version = os.environ["TAG"][1:]
          package = entry["packages"][0]
          if entry["name"] != os.environ["SERVER_NAME"]:
              sys.exit("::error::server.json names %s" % entry["name"])
          if entry["version"] != version or package["version"] != version:
              sys.exit("::error::server.json states %s, not %s" % (entry["version"], version))
          if (package["registryType"], package["identifier"]) != ("pypi", "rowih"):
              sys.exit("::error::server.json names another package")
          PY
      - name: Check that the package on PyPI names the entry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          curl --fail --silent --show-error --location --output release.json \
            "https://pypi.org/pypi/rowih/${TAG#v}/json"
          python3 - <<'PY'
          import json, os, sys
          description = json.load(open("release.json", encoding="utf-8"))["info"]["description"]
          if "mcp-name: %s" % os.environ["SERVER_NAME"] not in description:
              sys.exit("::error::the description of rowih on PyPI does not name the entry")
          PY
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Download and verify the registry's publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" \
            "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate the entry
        run: ./mcp-publisher validate
      - name: Sign in to the registry with GitHub's identity token
        run: ./mcp-publisher login github-oidc
      - name: Publish the entry
        run: ./mcp-publisher publish
